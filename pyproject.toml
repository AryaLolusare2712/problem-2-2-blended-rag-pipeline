[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderlens-task7"
version = "0.1.0"
description = "Hybrid RAG retrieval for public procurement documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "pypdf>=4.0"
]

[project.scripts]
tenderlens = "tenderlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
